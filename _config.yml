# ─────────────────────────────────────────────
#  Site settings — edit these
# ─────────────────────────────────────────────
title: Sure Yeah                      # shown top-left and in browser tab
description: Toronto-based DJ and producer  # shown in link previews
url: "https://sureyeah.ca"         # your custom domain, no trailing slash
baseurl: ""                           # leave empty when using a custom domain

# Photo on the landing page (put the file in assets/images/)
landing_photo: /assets/images/me.jpg
landing_photo_alt: Me!

# Links shown at the bottom of every page. Delete or add lines freely.
links:
  - name: Instagram
    url: https://instagram.com/suureyeah
  - name: SoundCloud
    url: https://soundcloud.com/sureyeahmusic
  - name: Email
    url: mailto:booking@sureyeah.ca

# Menu order (each entry must match a page's file)
nav:
  - title: About
    url: /about/
  - title: Upcoming
    url: /upcoming/
  - title: Listen/Archive
    url: /archive/

# ─────────────────────────────────────────────
#  Build settings — no need to touch
# ─────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-seo-tag
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
